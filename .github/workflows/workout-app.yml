name: workout-app

on:
  push:
    paths: ["workout_app/**", ".github/workflows/workout-app.yml"]
  pull_request:
    paths: ["workout_app/**", ".github/workflows/workout-app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: workout_app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workout_app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Security static analysis
        run: bandit -q -c pyproject.toml -r app
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements.txt
      - name: Tests
        run: pytest -q
