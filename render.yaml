# One-click deploy of FitLog (workout_app/) on Render.
# Render dashboard -> New -> Blueprint -> pick this repository.
# Costs about $13/month: Starter web service ($7, always on) + Basic Postgres ($6).
# To try it for free, change both plans to "free": the app then sleeps after 15 minutes
# idle, and a free database is DELETED 30 days after creation (with all your workouts).

services:
  - type: web
    name: fitlog
    runtime: python
    rootDir: workout_app
    region: virginia            # closest to Miami; must match the database region
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --timeout 120: an AI-built workout can take ~40 s; gunicorn's default 30 s would cut it off.
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: PROXY_FIX_HOPS
        value: "1"
      - key: DEFAULT_TIMEZONE
        value: America/New_York
      - key: DATABASE_URL
        fromDatabase:
          name: fitlog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Optional features: Render asks for these when you create the Blueprint.
      # Leave any of them empty to keep that feature switched off; add them later in
      # the service's Environment tab.
      - key: ANTHROPIC_API_KEY      # AI coach (Claude)
        sync: false
      - key: GOOGLE_CLIENT_ID       # "Continue with Google"
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OURA_CLIENT_ID         # Oura Ring sync
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY        # automatic how-to videos
        sync: false

databases:
  - name: fitlog-db
    databaseName: fitlog
    region: virginia
    plan: basic-256mb
    ipAllowList: []             # no access from the internet; only the app can reach it
